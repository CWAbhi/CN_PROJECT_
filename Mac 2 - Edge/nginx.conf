# Generated from settings.env. Edit settings.env and rerun render_nginx.py.
# CHANGE Mac 2/3/4 IPs in settings.env when using separate laptops.
worker_processes 1;
pid "/Users/abhijeetdey/Desktop/CN_Project/Mac 2 - Edge/nginx.pid";
error_log "/Users/abhijeetdey/Desktop/CN_Project/Mac 2 - Edge/nginx-error.log" info;
events { worker_connections 256; }
http {
    access_log "/Users/abhijeetdey/Desktop/CN_Project/Mac 2 - Edge/nginx-access.log";
    upstream backend_pool {
        # Mac 3 Backend A, then Mac 4 Backend B; nginx uses round robin.
        server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 10.7.21.150:8443 ssl;
        server_name app.team1.test api.team1.test;
        ssl_certificate "/Users/abhijeetdey/Desktop/CN_Project/Mac 2 - Edge/certs/server.crt";
        ssl_certificate_key "/Users/abhijeetdey/Desktop/CN_Project/Mac 2 - Edge/certs/server.key";
        # Phase 1 packet capture: TLS 1.2 shows certificate and ChangeCipherSpec.
        ssl_protocols TLSv1.2;
        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
